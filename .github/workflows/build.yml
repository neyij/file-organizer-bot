name: Build Cross-Platform Apps

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      # Windows build step
      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --noconsole --name="FileOrganizerBot" organize_files.py

      - name: Upload Windows Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FileOrganizerBot-Windows
          path: dist/FileOrganizerBot.exe

      # macOS build step
      - name: Build macOS App Bundle
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconsole --windowed --name="FileOrganizerBot" organize_files.py
          cd dist
          zip -r FileOrganizerBot-macOS.zip FileOrganizerBot.app

      - name: Upload macOS Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: FileOrganizerBot-macOS
          path: dist/FileOrganizerBot-macOS.zip
